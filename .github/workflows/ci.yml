name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.expect }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pi 1.0 requires node >= 22.19.0 and ships the bundled runtime.
          - { os: ubuntu-latest,  node: 22, expect: bundle, pi: "@earendil-works/pi-coding-agent@1" }
          - { os: ubuntu-latest,  node: 24, expect: bundle, pi: "@earendil-works/pi-coding-agent@1" }
          - { os: windows-latest, node: 22, expect: bundle, pi: "@earendil-works/pi-coding-agent@1" }
          - { os: windows-latest, node: 24, expect: bundle, pi: "@earendil-works/pi-coding-agent@1" }
          # 0.99.2 is the last release supporting node 20, and it uses the
          # pre-bundle layout (imports @earendil-works/pi-tui from node_modules).
          # This job exercises the legacy patch path against a real install.
          - { os: ubuntu-latest,  node: 20, expect: legacy, pi: "@earendil-works/pi-coding-agent@0.99.2" }
          - { os: windows-latest, node: 20, expect: legacy, pi: "@earendil-works/pi-coding-agent@0.99.2" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Unit tests only; integration tests skip cleanly with no Pi install.
      - name: Syntax check and unit tests
        run: npm run check

      # Install Pi locally (NOT as a dependency) so the integration tests have
      # a real install to read. Deliberately fatal: if this breaks, the patch
      # anchors need to be re-verified against the new layout.
      - name: Install Pi locally (${{ matrix.pi }})
        run: npm install --no-save --ignore-scripts ${{ matrix.pi }}

      - name: Show installed Pi version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            // Read directly: Pi has an exports map that blocks the
            // ./package.json subpath, so require() cannot resolve it.
            const p = path.join("node_modules", "@earendil-works", "pi-coding-agent", "package.json");
            console.log("installed pi:", JSON.parse(fs.readFileSync(p, "utf8")).version);
          '

      - name: Assert the expected runtime layout was discovered
        shell: bash
        env:
          EXPECT_LAYOUT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          node bin/pi-persian-rtl-bundle.cjs doctor --json > targets.json
          node -e '
            const t = require("./targets.json");
            const expect = process.env.EXPECT_LAYOUT;
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            console.log("bundle targets:", t.bundle.length, "| legacy targets:", t.legacy.length);
            if (t.live.length === 0) fail("no live patch target discovered at all");
            if (expect === "bundle" && t.bundle.length === 0) fail("expected a runtime bundle target, found none");
            if (expect === "legacy" && t.legacy.length === 0) fail("expected a legacy pi-tui target, found none");
            console.log("layout OK: " + expect);
          '

      - name: Full test suite (integration tests enabled)
        shell: bash
        env:
          EXPECT_LAYOUT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          node --test > test-output.txt 2>&1 || { cat test-output.txt; exit 1; }
          tail -12 test-output.txt
          skipped="$(grep -c '# SKIP' test-output.txt || true)"
          echo "skipped tests: $skipped"
          # Bundle jobs have a real Pi 1.x install, so nothing should skip.
          if [ "$EXPECT_LAYOUT" = "bundle" ] && [ "$skipped" -gt 2 ]; then
            echo "::error::too many skipped tests ($skipped) — integration tests did not run"
            exit 1
          fi

      - name: Apply / check / restore round-trip on the real install
        shell: bash
        run: |
          set -euo pipefail
          node bin/pi-persian-rtl-bundle.cjs apply
          node bin/pi-persian-rtl-bundle.cjs check
          node bin/pi-persian-rtl-bundle.cjs apply
          node bin/pi-persian-rtl-bundle.cjs restore
          if node bin/pi-persian-rtl-bundle.cjs check; then
            echo "::error::check still reports patched after restore"; exit 1
          fi
          echo "round-trip OK"

  pack:
    name: verify npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert package.json manifest shape
        run: |
          node -e '
            const p = require("./package.json");
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1); };
            if (!p.keywords.includes("pi-package")) fail("missing pi-package keyword (pi.dev gallery discovery)");
            if (!p.pi || !Array.isArray(p.pi.extensions) || p.pi.extensions.length === 0) fail("missing pi.extensions manifest");
            if (p.license !== "MIT") fail("license must be MIT");
            if (!p.repository || !p.repository.url) fail("missing repository field");
            if (!p.bugs || !p.bugs.url) fail("missing bugs field");
            if (!p.author) fail("missing author field");
            for (const dep of Object.keys(p.dependencies ?? {})) fail("unexpected runtime dependency: " + dep);
            console.log("package.json manifest OK");
          '

      - name: Assert required files are in the tarball
        shell: bash
        run: |
          set -euo pipefail
          out="$(npm pack --dry-run 2>&1)"
          echo "$out"
          for f in \
            "extensions/persian-rtl.ts" \
            "bin/pi-persian-rtl-bundle.cjs" \
            "lib/patch.cjs" \
            "lib/bidi-source.cjs" \
            "lib/bundle-locate.cjs" \
            "README.md" \
            "LICENSE"
          do
            grep -q "$f" <<< "$out" || { echo "::error::MISSING FROM TARBALL: $f"; exit 1; }
          done
          echo "tarball contents OK"
